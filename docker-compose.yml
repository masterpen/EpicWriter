version: '3.8'

services:
  # 1. Database (Neo4j)
  neo4j:
    image: neo4j:latest
    container_name: epic_writer_db
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  # 2. Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: epic_writer_api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
    depends_on:
      - neo4j

  # 3. Frontend (Streamlit)
  # Keeping the legacy version running for smooth migration
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: epic_writer_ui
    ports:
      - "8501:8501"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      # In the future, this can be updated to point to http://backend:8000
    depends_on:
      - neo4j
      - backend

volumes:
  neo4j_data:
  neo4j_logs:
