services:
  # 1. Database (Neo4j)
  neo4j:
    image: neo4j:latest
    container_name: epic_writer_db
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  # 2. Backend API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: epic_writer_api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev_secret_key_change_in_production}
      - APP_ENV=${APP_ENV:-development}
    depends_on:
      - neo4j
    restart: unless-stopped

  # 3. Frontend (React + Vite dev server)
  # Streamlit 版已废弃，直接用 node 镜像运行 Vite dev server，无需额外 Dockerfile
  frontend:
    image: node:20-alpine
    container_name: epic_writer_ui
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
